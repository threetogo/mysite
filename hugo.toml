baseURL = "https://ounose.noor.jp/"
languageCode = "ja"
title = "衛星のポライトネス"
theme = "random3"

paginate = 5

[params]
  description = "乳がん治療をしながら働き、本を読み、文章を書いている30代の記録。読書日記と創作活動、治療のある日常について、自分のペースで書き続ける10年日記。"
  author = "Ukai"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[markup.highlight]
  noClasses = false

[taxonomies]
  tag = "tags"
  category = "categories"